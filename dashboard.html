<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spaces Download Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 {
            color: #58a6ff;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card h2 {
            color: #58a6ff;
            font-size: 16px;
            margin-bottom: 12px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .stat {
            background: #0d1117;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #21262d;
        }
        .stat-label { font-size: 12px; color: #8b949e; }
        .stat-value { font-size: 20px; font-weight: bold; color: #f0f6fc; margin-top: 4px; }
        .progress-bar {
            width: 100%;
            height: 24px;
            background: #21262d;
            border-radius: 12px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #238636, #2ea043);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .source-list { list-style: none; }
        .source-list li {
            padding: 8px 0;
            border-bottom: 1px solid #21262d;
            display: flex;
            justify-content: space-between;
        }
        .source-list li:last-child { border-bottom: none; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-green { background: #238636; color: white; }
        .badge-blue { background: #1f6feb; color: white; }
        .badge-yellow { background: #9e6a03; color: white; }
        .refresh-info {
            text-align: center;
            color: #8b949e;
            font-size: 12px;
            margin-top: 20px;
        }
        .log {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-entry { padding: 2px 0; }
        .log-time { color: #8b949e; }
        .log-success { color: #3fb950; }
        .log-error { color: #f85149; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 3D Spaces Download Dashboard</h1>

        <div class="card">
            <h2>Storage Overview</h2>
            <div class="progress-bar">
                <div class="progress-fill" id="storageBar">0%</div>
            </div>
            <div class="stat-grid">
                <div class="stat">
                    <div class="stat-label">Used</div>
                    <div class="stat-value" id="used">0 GB</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Remaining</div>
                    <div class="stat-value" id="remaining">50 GB</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Total Files</div>
                    <div class="stat-value" id="files">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Usage</div>
                    <div class="stat-value" id="usage">0%</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>By Asset Type</h2>
            <ul class="source-list" id="typeList">
                <li>Loading...</li>
            </ul>
        </div>

        <div class="card">
            <h2>Recent Activity</h2>
            <div class="log" id="log">
                <div class="log-entry"><span class="log-time">Loading...</span></div>
            </div>
        </div>

        <div class="refresh-info">
            Auto-refreshes every 10 seconds • Last updated: <span id="lastUpdate">-</span>
        </div>
    </div>

    <script>
        async function fetchProgress() {
            try {
                const response = await fetch('/api/progress');
                const data = await response.json();

                // Update storage bar
                const pct = data.usage_pct || 0;
                document.getElementById('storageBar').style.width = pct + '%';
                document.getElementById('storageBar').textContent = pct.toFixed(1) + '%';

                // Update stats
                document.getElementById('used').textContent = data.used_gb ? data.used_gb.toFixed(1) + ' GB' : '0 GB';
                document.getElementById('remaining').textContent = data.remaining_gb ? data.remaining_gb.toFixed(1) + ' GB' : '50 GB';
                document.getElementById('files').textContent = data.total_files || 0;
                document.getElementById('usage').textContent = pct.toFixed(1) + '%';

                // Update type list
                const typeList = document.getElementById('typeList');
                typeList.innerHTML = '';
                if (data.by_type) {
                    for (const [type, info] of Object.entries(data.by_type)) {
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <span>${type} <span class="badge badge-blue">${info.files} files</span></span>
                            <span>${info.size_gb.toFixed(1)} GB</span>
                        `;
                        typeList.appendChild(li);
                    }
                }

                // Update log
                const log = document.getElementById('log');
                log.innerHTML = '';
                if (data.recent) {
                    for (const entry of data.recent.slice(-10).reverse()) {
                        const div = document.createElement('div');
                        div.className = 'log-entry';
                        const statusClass = entry.status === 'success' ? 'log-success' : 'log-error';
                        div.innerHTML = `<span class="log-time">${entry.time}</span> <span class="${statusClass}">[${entry.status}]</span> ${entry.message}`;
                        log.appendChild(div);
                    }
                }

                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            } catch (err) {
                console.error('Failed to fetch progress:', err);
            }
        }

        // Fetch immediately, then every 10 seconds
        fetchProgress();
        setInterval(fetchProgress, 10000);
    </script>
</body>
</html>
