<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spaces Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0e17;
            color: #e0e6ed;
            overflow: hidden;
        }
        
        #app {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #1f2937;
        }
        
        .sidebar-header h1 {
            font-size: 18px;
            color: #60a5fa;
            margin-bottom: 8px;
        }
        
        .search-box {
            width: 100%;
            padding: 8px 12px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #e0e6ed;
            font-size: 14px;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #60a5fa;
        }
        
        .tabs {
            display: flex;
            padding: 8px;
            gap: 4px;
            border-bottom: 1px solid #1f2937;
        }
        
        .tab {
            flex: 1;
            padding: 8px;
            background: #1f2937;
            border: none;
            border-radius: 4px;
            color: #9ca3af;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .tab:hover { background: #374151; }
        .tab.active { 
            background: #2563eb; 
            color: white;
        }
        
        .asset-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        .asset-item {
            padding: 12px;
            background: #1f2937;
            border-radius: 6px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .asset-item:hover {
            background: #374151;
            border-color: #60a5fa;
        }
        
        .asset-item.active {
            background: #1e3a8a;
            border-color: #60a5fa;
        }
        
        .asset-name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .asset-meta {
            font-size: 11px;
            color: #9ca3af;
        }
        
        /* Viewer */
        .viewer {
            position: relative;
            background: #000;
        }
        
        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .viewer-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(17, 24, 39, 0.9);
            padding: 12px 16px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
        }
        
        .viewer-title {
            font-size: 16px;
            font-weight: 600;
            color: #60a5fa;
        }
        
        .viewer-info {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }
        
        .controls {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(17, 24, 39, 0.9);
            padding: 8px 16px;
            border-radius: 24px;
            backdrop-filter: blur(8px);
        }
        
        .control-btn {
            padding: 8px 16px;
            background: #374151;
            border: none;
            border-radius: 16px;
            color: #e0e6ed;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .control-btn:hover { background: #4b5563; }
        .control-btn.active { background: #2563eb; }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #374151;
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #6b7280;
        }
        
        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>📦 3D Spaces Viewer</h1>
                <input type="text" class="search-box" placeholder="Search assets..." id="search">
            </div>
            <div class="tabs">
                <button class="tab active" data-type="all">All</button>
                <button class="tab" data-type="hdris">HDRIs</button>
                <button class="tab" data-type="models">Models</button>
                <button class="tab" data-type="textures">Textures</button>
            </div>
            <div class="asset-list" id="assetList">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
        
        <div class="viewer">
            <canvas id="canvas3d"></canvas>
            <div class="viewer-overlay" id="overlay" style="display: none;">
                <div class="viewer-title" id="viewerTitle"></div>
                <div class="viewer-info" id="viewerInfo"></div>
            </div>
            <div class="controls">
                <button class="control-btn active" data-env="studio">Studio</button>
                <button class="control-btn" data-env="sunset">Sunset</button>
                <button class="control-btn" data-env="night">Night</button>
                <button class="control-btn" id="resetCamera">Reset</button>
            </div>
        </div>
    </div>

    <script>
        // Three.js setup
        let scene, camera, renderer, controls;
        let currentModel = null;
        let assets = [];
        let currentFilter = 'all';
        
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827);
            
            // Camera
            camera = new THREE.PerspectiveCamera(
                75, 
                window.innerWidth / 2 / window.innerHeight, 
                0.1, 
                1000
            );
            camera.position.set(0, 1, 3);
            
            // Renderer
            const canvas = document.getElementById('canvas3d');
            renderer = new THREE.WebGLRenderer({ 
                canvas, 
                antialias: true,
                alpha: true 
            });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            
            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 0.5;
            controls.maxDistance = 10;
            
            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);
            
            // Grid
            const gridHelper = new THREE.GridHelper(10, 10, 0x374151, 0x1f2937);
            scene.add(gridHelper);
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
            
            // Resize handler
            window.addEventListener('resize', () => {
                camera.aspect = canvas.clientWidth / canvas.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            });
            
            // Load assets
            fetchAssets();
        }
        
        async function fetchAssets() {
            try {
                const response = await fetch('/api/assets');
                assets = await response.json();
                renderAssetList();
            } catch (err) {
                console.error('Failed to load assets:', err);
                document.getElementById('assetList').innerHTML = `
                    <div class="empty-state">
                        <p>Failed to load assets</p>
                    </div>
                `;
            }
        }
        
        function renderAssetList() {
            const list = document.getElementById('assetList');
            const searchTerm = document.getElementById('search').value.toLowerCase();
            
            const filtered = assets.filter(asset => {
                const matchesSearch = asset.name.toLowerCase().includes(searchTerm);
                const matchesType = currentFilter === 'all' || asset.type === currentFilter;
                return matchesSearch && matchesType;
            });
            
            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <p>No assets found</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = filtered.map(asset => `
                <div class="asset-item" data-id="${asset.id}" data-type="${asset.type}">
                    <div class="asset-name">${asset.name}</div>
                    <div class="asset-meta">
                        ${asset.type.toUpperCase()} • ${(asset.size / 1024 / 1024).toFixed(1)} MB
                    </div>
                </div>
            `).join('');
            
            // Add click handlers
            list.querySelectorAll('.asset-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = item.dataset.id;
                    const asset = assets.find(a => a.id === id);
                    if (asset) loadAsset(asset);
                    
                    // Update active state
                    list.querySelectorAll('.asset-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                });
            });
        }
        
        async function loadAsset(asset) {
            // Show loading
            const overlay = document.getElementById('overlay');
            const title = document.getElementById('viewerTitle');
            const info = document.getElementById('viewerInfo');
            
            overlay.style.display = 'block';
            title.textContent = asset.name;
            info.textContent = `${asset.type.toUpperCase()} • ${(asset.size / 1024 / 1024).toFixed(1)} MB`;
            
            // Clear current model
            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }
            
            try {
                if (asset.type === 'model') {
                    // For now, show a placeholder cube since we have .blend files
                    const geometry = new THREE.BoxGeometry(1, 1, 1);
                    const material = new THREE.MeshStandardMaterial({ 
                        color: 0x60a5fa,
                        metalness: 0.3,
                        roughness: 0.4
                    });
                    currentModel = new THREE.Mesh(geometry, material);
                    currentModel.position.y = 0.5;
                    scene.add(currentModel);
                    
                    info.textContent += ' (Preview - convert to GLB for full viewing)';
                } else if (asset.type === 'hdri') {
                    // Show environment sphere with HDRI texture
                    const geometry = new THREE.SphereGeometry(5, 32, 32);
                    const material = new THREE.MeshBasicMaterial({
                        color: 0x2563eb,
                        side: THREE.BackSide,
                        transparent: true,
                        opacity: 0.3
                    });
                    currentModel = new THREE.Mesh(geometry, material);
                    scene.add(currentModel);
                }
            } catch (err) {
                console.error('Failed to load asset:', err);
                info.textContent = 'Failed to load';
            }
        }
        
        // Event listeners
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                currentFilter = tab.dataset.type;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderAssetList();
            });
        });
        
        document.getElementById('search').addEventListener('input', renderAssetList);
        
        document.getElementById('resetCamera').addEventListener('click', () => {
            camera.position.set(0, 1, 3);
            controls.target.set(0, 0.5, 0);
            controls.update();
        });
        
        document.querySelectorAll('[data-env]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-env]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const env = btn.dataset.env;
                if (env === 'studio') {
                    scene.background = new THREE.Color(0x111827);
                } else if (env === 'sunset') {
                    scene.background = new THREE.Color(0x7c2d12);
                } else if (env === 'night') {
                    scene.background = new THREE.Color(0x030712);
                }
            });
        });
        
        // Initialize
        init();
    </script>
</body>
</html>
